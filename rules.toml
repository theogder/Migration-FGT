# Règles de conversion 300E -> 120G (SPEC §5.4).
#
# Ce fichier ne contient que des règles dont on est certain. Les autres sont
# ajoutées au fil des itérations, à partir du config-error-log du 120G de lab
# (commande « fortimig errlog »).
#
# Format :
#   path   = "config a b"  ou  "config a b > config c"  (niveaux edit ignorés,
#            s'applique dans tous les VDOM)
#   option = "nom-option"  (facultatif : vise l'option plutôt que le bloc)
#   action = "remove" (SUPPRIME) | "flag" (A_REVOIR, aucune modification)
#            | "keep_target" (bloc absent de la source : repris de la
#              configuration par défaut du 120G ; bloc entier uniquement)
#   reason = "pourquoi"

[[rule]]
path = "config system npu"
action = "keep_target"
reason = "Bloc NPU propre au 120G (np-queues), absent du 300E : sans lui, la restauration vide le NPU du primaire alors que le secondaire neuf l'a encore ; checksums HA différents et cluster non synchronisé (observé sur le lab)."

[[rule]]
path = "config system np6"
action = "remove"
reason = "Bloc NP6 propre au 300E : refusé par le 120G de lab (config-error-log : « \"config\" \"system\" \"np6\" @ …:global:command parse error (error -61) »)."
