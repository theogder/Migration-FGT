#config-version=FGSRC0-7.04-FW-build9999-991231:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890123456
#buildno=9999
#global_vdom=1
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC FAKE-ENC-BLOB-ADMIN-0001==
    next
end
config vpn certificate local
    edit "cert-exemple"
        set password ENC FAKE-ENC-BLOB-CERT-0002==
        set comments "Certificat factice"
        set private-key "-----BEGIN ENCRYPTED PRIVATE KEY-----
FAKEKEYLINE0001FAKEKEYLINE0001FAKEKEYLINE0001
FAKEKEYLINE0002FAKEKEYLINE0002FAKEKEYLINE0002
-----END ENCRYPTED PRIVATE KEY-----"
        set certificate "-----BEGIN CERTIFICATE-----
FAKECERTLINE0001FAKECERTLINE0001FAKECERTLINE0001
FAKECERTLINE0002FAKECERTLINE0002FAKECERTLINE0002
-----END CERTIFICATE-----"
        set range global
    next
end
config system replacemsg admin "pre_admin-disclaimer-text"
    set buffer "Acces reserve.
Texte avec \"guillemets\" echappes
et un antislash \\ double.

Ligne apres une ligne vide."
    set format html
end
config system automation-action
    edit "script-exemple"
        set action-type cli-script
        set script "config system global
set admin-timeout 30
end"
        set accprofile "super_admin"
    next
end
config user local
    edit "utilisateur-exemple"
        set type password
        set passwd ENC FAKE-ENC-BLOB-USER-0003==
    next
end
