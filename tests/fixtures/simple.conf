#config-version=FGSRC0-7.4.9-FW-build9999-991231:opmode=0:vdom=0:user=admin
#conf_file_ver=1234567890123456
#buildno=9999
#global_vdom=1
config system global
    set alias "FGSRC0-EXEMPLE"
    set hostname "FW-EXEMPLE-01"
    set timezone 28
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set description "Lien \"principal\" vers le coeur"
        set snmp-index 1
        config ipv6
            set ip6-mode static
        end
    next
    edit "port2"
        set vdom "root"
        set type physical
        set snmp-index 2
    next
    edit "agg1"
        set vdom "root"
        set type aggregate
        set member "port3" "port4"
        set snmp-index 20
    next
    edit "vlan100"
        set vdom "root"
        set ip 198.51.100.1 255.255.255.0
        set interface "port2"
        set vlanid 100
    next
end
config firewall address
    edit "srv-web"
        set subnet 203.0.113.10 255.255.255.255
        set comment "Serveur l'exemple"
    next
    edit "net-lan"
        set subnet 192.0.2.0 255.255.255.0
    next
end
config firewall addrgrp
    edit "grp-serveurs"
        set member "srv-web" "net-lan"
    next
end
config firewall policy
    edit 42
        set name "lan-vers-web"
        set srcintf "port1"
        set dstintf "vlan100"
        set action accept
        set srcaddr "net-lan"
        set dstaddr "srv-web"
        set schedule "always"
        set service "HTTP" "HTTPS"
        set logtraffic all
    next
    edit 7
        set name "retour"
        set srcintf "vlan100"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        unset logtraffic
    next
end
config system sdwan
    set status enable
    config health-check
        edit "hc-exemple"
            set server "192.0.2.254"
            config sla
                edit 1
                    set latency-threshold 100
                    set jitter-threshold 20
                next
            end
        next
    end
end
