#config-version=FGSRC0-7.4.9-FW-build9999-991231:opmode=0:vdom=1:user=admin
#conf_file_ver=1234567890123456
#buildno=9999
#global_vdom=1

config vdom
edit root
next
edit dmz
next
end

config global
config system global
    set hostname "FW-EXEMPLE-01"
    set vdom-mode multi-vdom
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 192.0.2.1 255.255.255.0
        set type physical
    next
    edit "port2"
        set vdom "dmz"
        set type physical
    next
end
config system ha
    set group-id 10
    set group-name "HA-EXEMPLE"
    set mode a-p
    set password ENC FAKE-ENC-BLOB-HA-0004==
    set hbdev "ha1" 50 "ha2" 50
    set session-pickup enable
    set override disable
    set priority 200
    set monitor "port1" "port2"
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "mgmt1"
            set gateway 192.0.2.254
        next
    end
end
end
config vdom
edit root
config firewall address
    edit "net-root"
        set subnet 192.0.2.0 255.255.255.0
    next
end
config firewall policy
    edit 1
        set srcintf "port1"
        set dstintf "port1"
        set srcaddr "net-root"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
    next
end
end
config vdom
edit dmz
config firewall address
    edit "net-dmz"
        set subnet 198.51.100.0 255.255.255.0
    next
end
end
