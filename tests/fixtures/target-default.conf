#config-version=FGDST0-7.4.9-FW-build9999-000000:opmode=0:vdom=1:user=admin
#conf_file_ver=1111111111111111
#buildno=9999
#global_vdom=1
config vdom
edit root
next
end
config global
config system global
    set alias "FGDST0-EXEMPLE"
    set hostname "FGDST0-EXEMPLE"
    set vdom-mode multi-vdom
end
config system npu
    config np-queues
        config ethernet-type
            edit "ARP"
                set type 806
                set queue 9
            next
        end
    end
end
config system interface
    edit "mgmt"
        set vdom "root"
        set ip 192.168.1.99 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set dedicated-to management
        set role lan
        set snmp-index 1
    next
    edit "ha"
        set vdom "root"
        set type physical
        set snmp-index 2
    next
    edit "port1"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh fgfm
        set type physical
        set snmp-index 3
    next
    edit "port2"
        set vdom "root"
        set mode dhcp
        set allowaccess ping https ssh fgfm
        set type physical
        set snmp-index 4
    next
    edit "port3"
        set vdom "root"
        set type physical
        set snmp-index 5
    next
    edit "port4"
        set vdom "root"
        set type physical
        set snmp-index 6
    next
    edit "port5"
        set vdom "root"
        set type physical
        set snmp-index 7
    next
    edit "port6"
        set vdom "root"
        set type physical
        set snmp-index 8
    next
    edit "x1"
        set vdom "root"
        set type physical
        set mediatype sr
        set snmp-index 9
        set speed 10000full
    next
    edit "x2"
        set vdom "root"
        set type physical
        set mediatype sr
        set snmp-index 10
        set speed 10000full
    next
    edit "modem"
        set vdom "root"
        set mode pppoe
        set status down
        set type physical
        set snmp-index 11
    next
    edit "npu0_vlink0"
        set vdom "root"
        set type physical
        set snmp-index 14
    next
    edit "npu0_vlink1"
        set vdom "root"
        set type physical
        set snmp-index 15
    next
    edit "lan"
        set vdom "root"
        set ip 192.168.100.99 255.255.255.0
        set allowaccess ping https ssh fabric
        set type hard-switch
        set stp enable
        set role lan
        set snmp-index 12
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set member "x1" "x2"
        set snmp-index 13
    next
end
config system physical-switch
    edit "sw0"
        set age-val 0
    next
end
config system virtual-switch
    edit "lan"
        set physical-switch "sw0"
        config port
            edit "port3"
            next
            edit "port4"
            next
        end
    next
end
config system ha
    set override disable
end
end
config vdom
edit root
config system dhcp server
    edit 1
        set dns-service default
        set default-gateway 192.168.100.99
        set netmask 255.255.255.0
        set interface "lan"
        config ip-range
            edit 1
                set start-ip 192.168.100.110
                set end-ip 192.168.100.210
            next
        end
    next
end
end
