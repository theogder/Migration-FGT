[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fortimig"
version = "0.1.0"
description = "Conversion de configuration FortiGate 300E (FortiOS 7.4) vers FortiGate 120G"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fortimig = "fortimig.cli:main"

[tool.setuptools]
packages = ["fortimig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
